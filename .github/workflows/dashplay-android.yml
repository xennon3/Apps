name: Dashplay (Android APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dashplay/**'
      - '.github/workflows/dashplay-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dashplay-APK
          path: dashplay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
