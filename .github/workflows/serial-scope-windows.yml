name: Serial Scope (Windows app)

on:
  workflow_dispatch:
  push:
    paths:
      - 'serial-scope/**'
      - '.github/workflows/serial-scope-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: serial-scope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serial-scope/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Serial-Scope-Windows
          path: serial-scope/dist/*.exe
          if-no-files-found: error
