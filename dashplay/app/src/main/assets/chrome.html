<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbar</title>
<link rel="stylesheet" href="kit/arcade.css">
<style>
  /* The browser toolbar, shown above web pages on the car. WebSurface sizes this page to
     the toolbar height and pushes the page state into setState(). */
  :root { --accent: #FFC24B; }
  body {
    display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 100%;
    background: #0F1218; border-bottom: 1px solid var(--line); position: relative;
  }
  .tb {
    flex: none; height: 76%; aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; color: var(--text);
  }
  .tb svg { width: clamp(20px, 40vh, 28px); height: clamp(20px, 40vh, 28px); fill: currentColor; }
  .tb:active { background: var(--surface-2); }
  .tb:disabled { opacity: .28; }
  .pill {
    flex: 1; min-width: 0; height: 76%; display: flex; align-items: center; gap: 10px; padding: 0 16px; margin: 0 4px;
    border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); text-align: left;
  }
  .pill:active { border-color: var(--accent); }
  .pill svg { flex: none; width: 18px; height: 18px; fill: var(--muted); }
  .pill.secure svg { fill: var(--good); }
  .pill .text { min-width: 0; display: flex; align-items: baseline; gap: 10px; overflow: hidden; white-space: nowrap; }
  .pill b { font-size: clamp(14px, 32vh, 18px); overflow: hidden; text-overflow: ellipsis; }
  .pill span { color: var(--muted); font-size: clamp(12px, 27vh, 15px); flex: none; }
  .pill .search { color: var(--muted); font-weight: 600; }
  .zoom { flex: none; height: 76%; padding: 0 12px; border-radius: 14px; font-weight: 800; font-size: clamp(13px, 30vh, 17px); color: var(--text); }
  .zoom small { color: var(--muted); font-weight: 600; margin-left: 4px; font-size: .8em; }
  .zoom:active { background: var(--surface-2); }
  .progress {
    position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); transition: width .2s, opacity .4s;
  }
  .progress.done { opacity: 0; }
</style>
</head>
<body>
  <button class="tb" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <button class="tb" id="forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
  <button class="tb" id="reload" aria-label="Reload"></button>
  <button class="pill" id="pill" aria-label="Address">
    <svg viewBox="0 0 24 24" id="lock"></svg>
    <div class="text"><b id="title"></b><span id="host"></span></div>
  </button>
  <button class="zoom" id="zoom" aria-label="Text size">Aa<small id="zoomPct"></small></button>
  <button class="tb" id="start" aria-label="Start page"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></button>
  <div class="progress done" id="progress"></div>
<script>
const ICONS = {
  reload: '<svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
  lock: '<path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/>',
  info: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>',
  search: '<path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>',
};
const host = window.DashplayChrome || { back() {}, forward() {}, reload() {}, stop() {}, address() {}, start() {}, textSize() {} };
const $ = id => document.getElementById(id);
let state = {};

$('back').onclick = () => host.back();
$('forward').onclick = () => host.forward();
$('reload').onclick = () => state.loading ? host.stop() : host.reload();
$('pill').onclick = () => host.address();
$('zoom').onclick = () => host.textSize();
$('start').onclick = () => host.start();

window.setState = s => {
  state = s;
  $('back').disabled = !s.canBack;
  $('forward').disabled = !s.canForward;
  $('reload').innerHTML = s.loading ? ICONS.stop : ICONS.reload;
  const pill = $('pill');
  pill.classList.toggle('secure', !!s.secure);
  $('lock').innerHTML = s.url ? (s.secure ? ICONS.lock : ICONS.info) : ICONS.search;
  $('title').textContent = s.url ? (s.title || s.host) : 'Search or type a web address';
  $('title').className = s.url ? '' : 'search';
  $('host').textContent = s.url && s.title && s.title !== s.host ? s.host : '';
  $('zoomPct').textContent = s.textZoom && s.textZoom !== 100 ? s.textZoom + '%' : '';
  const p = $('progress');
  p.style.width = (s.loading ? Math.max(8, s.progress) : 100) + '%';
  p.classList.toggle('done', !s.loading);
};
setState({ url: '', loading: false });
</script>
</body>
</html>
