<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane Racer</title>
<link rel="stylesheet" href="../kit/arcade.css">
</head>
<body>
<script src="../kit/games.js"></script>
<script src="../kit/arcade.js"></script>
<script>
const { rand, pick, roundRect, emoji } = Arcade;
const LANES = 3;
const COLORS = ['#4CC9F0', '#FFC24B', '#8B7CFF', '#F4A261', '#E8EDF5', '#2EC4B6'];
let road, lane, laneX, traffic, cans, speed, dist, spawnGap, scroll, shake, bonus = 0;

function layout(W, H) {
  const w = Math.min(W * 0.62, H * 1.15);
  road = { x: (W - w) / 2, w, lw: w / LANES, carW: w / LANES * 0.52, carH: w / LANES * 0.52 * 1.75 };
}

function laneCenter(i) { return road.x + road.lw * (i + 0.5); }

const game = Arcade.create({
  id: 'lane-racer',
  keys: [['Tap left / right', 'change lane'], ['◀ ▶', 'gamepad']],
  resize: layout,
  start() {
    lane = 1; laneX = laneCenter(1); traffic = []; cans = []; speed = game.H * 0.55; dist = 0;
    spawnGap = 0; scroll = 0; shake = 0; bonus = 0;
  },
  tap(x) { steer(x < game.W / 2 ? -1 : 1); },
  key(k) { if (k === 'left') steer(-1); if (k === 'right') steer(1); },
  update(dt) {
    const { H } = game;
    speed = Math.min(H * 1.9, speed + H * 0.018 * dt * 2);
    dist += speed * dt; scroll = (scroll + speed * dt) % (H / 5);
    laneX += (laneCenter(lane) - laneX) * Math.min(1, dt * 14);
    game.set(Math.floor(dist / H * 12) + bonus);

    spawnGap -= speed * dt;
    if (spawnGap <= 0) spawnRow();

    const py = H - road.carH * 1.25;
    const hit = (o, pad) => Math.abs(o.x - laneX) < road.carW * pad && Math.abs(o.y - py) < road.carH * (pad + 0.05);
    for (let i = traffic.length - 1; i >= 0; i--) {
      const c = traffic[i];
      c.y += (speed - c.v) * dt;
      if (c.y > H + road.carH) { traffic.splice(i, 1); continue; }
      if (hit(c, 0.82)) {
        // The tap that dodges this car may still be on its way from the car screen, so it
        // only counts as a crash if the cars are still touching after the touch delay.
        c.touching = (c.touching || 0) + dt;
        if (c.touching > Arcade.lag) { shake = 1; navigator.vibrate?.(200); game.end('Crashed!'); return; }
      } else c.touching = 0;
    }
    for (let i = cans.length - 1; i >= 0; i--) {
      const c = cans[i];
      c.y += speed * dt;
      if (c.y > H + 50) { cans.splice(i, 1); continue; }
      if (hit(c, 0.9)) { cans.splice(i, 1); bonus += 25; game.sfx('point'); game.float('+25', c.x, c.y, '#FFC24B'); }
    }
  },
  draw(g, W, H, t) {
    if (!road) layout(W, H);
    g.save();
    if (shake > 0) { g.translate(rand(-8, 8) * shake, rand(-8, 8) * shake); shake = Math.max(0, shake - 0.03); }
    // Verge with rumble strips.
    g.fillStyle = '#16301F'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#1B3A26';
    for (let y = -H / 5 + (scroll || 0); y < H; y += H / 5) { g.fillRect(0, y, road.x, H / 10); g.fillRect(road.x + road.w, y, W, H / 10); }
    g.fillStyle = '#2B2F38'; g.fillRect(road.x, 0, road.w, H);
    for (let y = -H / 5 + (scroll || 0); y < H; y += H / 10) {
      g.fillStyle = (Math.round(y / (H / 10)) & 1) ? '#FF5A5F' : '#F2F4F8';
      g.fillRect(road.x - 10, y, 10, H / 10); g.fillRect(road.x + road.w, y, 10, H / 10);
    }
    g.fillStyle = '#F2F4F8cc';
    for (let i = 1; i < LANES; i++) {
      const x = road.x + road.lw * i - 3;
      for (let y = -H / 5 + (scroll || 0); y < H; y += H / 5) g.fillRect(x, y, 6, H / 10);
    }
    if (game.state === 'ready') { drawCar(g, laneCenter(1), H - road.carH * 1.25, '#FF5A5F', true); g.restore(); return; }
    cans.forEach(c => emoji(g, '⛽', c.x, c.y, road.carW * 0.7));
    traffic.forEach(c => drawCar(g, c.x, c.y, c.color, false));
    drawCar(g, laneX, H - road.carH * 1.25, '#FF5A5F', true);
    g.restore();
    // Speedometer.
    const kmh = Math.round(speed / H * 70);
    g.fillStyle = '#F2F4F8'; g.font = `800 ${H * 0.07}px system-ui`; g.textAlign = 'right'; g.textBaseline = 'bottom';
    g.fillText(kmh, W - W * 0.03, H - H * 0.07);
    g.fillStyle = '#8B95A7'; g.font = `600 ${H * 0.03}px system-ui`;
    g.fillText('km/h', W - W * 0.03, H - H * 0.03);
  },
});

function steer(d) {
  const next = Math.max(0, Math.min(LANES - 1, lane + d));
  if (next !== lane) { lane = next; game.sfx('tap'); }
}

function spawnRow() {
  const H = game.H;
  // Never block every lane: leave at least one open.
  const count = Math.random() < 0.35 + Math.min(0.35, dist / H / 400) ? 2 : 1;
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5).slice(0, count);
  lanes.forEach(l => traffic.push({ x: laneCenter(l), y: -road.carH, v: speed * rand(0.25, 0.5), color: pick(COLORS) }));
  if (Math.random() < 0.25) {
    const free = [0, 1, 2].filter(l => !lanes.includes(l));
    cans.push({ x: laneCenter(pick(free)), y: -road.carH * 2.2 });
  }
  spawnGap = road.carH * rand(2.1, 3.2);
}

function drawCar(g, x, y, color, player) {
  const w = road.carW, h = road.carH;
  g.fillStyle = '#0006'; roundRect(g, x - w / 2 + 4, y - h / 2 + 8, w, h, w * 0.28); g.fill();
  g.fillStyle = color; roundRect(g, x - w / 2, y - h / 2, w, h, w * 0.28); g.fill();
  g.fillStyle = '#0B0D12cc';
  roundRect(g, x - w * 0.36, y - h * (player ? 0.22 : 0.3), w * 0.72, h * 0.2, w * 0.1); g.fill();
  roundRect(g, x - w * 0.34, y + h * (player ? 0.18 : 0.12), w * 0.68, h * 0.14, w * 0.08); g.fill();
  // Player faces up with headlights; traffic shows red tail lights toward us.
  g.fillStyle = player ? '#FFF5C2' : '#FF3B3B';
  const ly = player ? y - h / 2 + 3 : y + h / 2 - 7;
  g.fillRect(x - w * 0.4, ly, w * 0.2, 4); g.fillRect(x + w * 0.2, ly, w * 0.2, 4);
  if (player) { g.fillStyle = '#ffffff22'; g.fillRect(x - w * 0.08, y - h / 2, w * 0.16, h); }
}
</script>
</body>
</html>
