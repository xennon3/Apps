<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn Snake</title>
<link rel="stylesheet" href="../kit/arcade.css">
</head>
<body>
<script src="../kit/games.js"></script>
<script src="../kit/arcade.js"></script>
<script>
const { roundRect } = Arcade;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // right, down, left, up: clockwise
let cell, cols, rows, ox, oy, snake, prev, dir, queued, food, stepTime, acc, tapFx = null;

const game = Arcade.create({
  id: 'turn-snake',
  keys: [['Tap left half', 'turn left'], ['Tap right half', 'turn right'], ['Arrows', 'gamepad']],
  resize(W, H) {
    // Big cells: this is played at arm's length. The top rows stay clear of the score bar.
    cell = Math.floor(Math.min(W / 24, H / 14));
    cols = Math.floor(W / cell); rows = Math.floor((H - cell * 1.6) / cell);
    ox = (W - cols * cell) / 2; oy = H - rows * cell - (H - cell * 1.6 - rows * cell) / 2;
  },
  start() {
    const y = Math.floor(rows / 2), x = Math.floor(cols / 3);
    snake = [[x, y], [x - 1, y], [x - 2, y]]; prev = snake.map(s => [...s]);
    dir = 0; queued = []; stepTime = 0.17; acc = 0;
    placeFood();
  },
  tap(x) {
    const d = x < game.W / 2 ? -1 : 1;
    queued.push(cur => (cur + d + 4) % 4);
    tapFx = { side: d, t: performance.now() };
  },
  key(k) {
    const target = { right: 0, down: 1, left: 2, up: 3 }[k];
    if (target != null) queued.push(cur => (Math.abs(cur - target) === 2 ? cur : target));
  },
  update(dt) {
    acc += dt;
    while (acc >= stepTime && game.state === 'playing') { acc -= stepTime; step(); }
  },
  draw(g, W, H, t) {
    g.fillStyle = '#0B0D12'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#121720';
    for (let x = 0; x < cols; x++) for (let y = 0; y < rows; y++) if ((x + y) & 1) g.fillRect(ox + x * cell, oy + y * cell, cell, cell);
    // The half you tapped glows briefly, so the controls teach themselves.
    if (tapFx) {
      const k = (t - tapFx.t) / 300;
      if (k < 1) { g.fillStyle = `rgba(61,220,132,${0.12 * (1 - k)})`; g.fillRect(tapFx.side < 0 ? 0 : W / 2, 0, W / 2, H); }
    }
    if (!snake) return;
    const pulse = 1 + Math.sin(t / 150) * 0.08;
    g.fillStyle = '#FF5A5F';
    g.beginPath(); g.arc(ox + (food[0] + .5) * cell, oy + (food[1] + .5) * cell, cell * .36 * pulse, 0, 7); g.fill();
    g.fillStyle = '#3DDC84aa'; g.fillRect(ox + (food[0] + .45) * cell, oy + (food[1] + .02) * cell, cell * .1, cell * .2);
    // Smoothly slide between grid steps.
    const k = game.state === 'playing' ? Math.min(1, acc / stepTime) : 1;
    snake.forEach((s, i) => {
      const p = prev[i] || s;
      let dx = s[0] - p[0], dy = s[1] - p[1];
      if (Math.abs(dx) > 1) dx = 0; if (Math.abs(dy) > 1) dy = 0;
      const x = p[0] + dx * k, y = p[1] + dy * k;
      const inset = i ? cell * 0.1 : cell * 0.04;
      g.fillStyle = `hsl(${145 - Math.min(i, 30) * 1.5},70%,${i ? 48 : 60}%)`;
      roundRect(g, ox + x * cell + inset, oy + y * cell + inset, cell - inset * 2, cell - inset * 2, cell * .32); g.fill();
      if (!i) {
        const [fx, fy] = DIRS[dir];
        g.fillStyle = '#0B0D12';
        [-1, 1].forEach(side => {
          g.beginPath();
          g.arc(ox + (x + .5 + fx * .18 - fy * .2 * side) * cell, oy + (y + .5 + fy * .18 + fx * .2 * side) * cell, cell * .08, 0, 7);
          g.fill();
        });
      }
    });
  },
});

function placeFood() {
  do food = [Math.floor(Math.random() * cols), Math.floor(Math.random() * rows)];
  while (snake.some(s => s[0] === food[0] && s[1] === food[1]));
}

function step() {
  if (queued.length) dir = queued.shift()(dir);
  const [dx, dy] = DIRS[dir];
  // Walls wrap around, which is kinder to a laggy car screen.
  const head = [(snake[0][0] + dx + cols) % cols, (snake[0][1] + dy + rows) % rows];
  if (snake.slice(0, -1).some(s => s[0] === head[0] && s[1] === head[1])) {
    game.sfx('bad'); game.end(`Length ${snake.length}`); return;
  }
  prev = snake.map(s => [...s]);
  snake.unshift(head);
  if (head[0] === food[0] && head[1] === food[1]) {
    game.add(1); game.sfx('point', 1 + Math.min(game.score, 20) * 0.02);
    game.float('+1', ox + (head[0] + .5) * cell, oy + head[1] * cell, '#3DDC84');
    stepTime = Math.max(0.085, stepTime - 0.004);
    prev.push(prev[prev.length - 1]);
    placeFood();
  } else snake.pop();
}
</script>
</body>
</html>
