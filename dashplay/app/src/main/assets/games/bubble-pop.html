<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Pop</title>
<link rel="stylesheet" href="../kit/arcade.css">
</head>
<body>
<script src="../kit/games.js"></script>
<script src="../kit/arcade.js"></script>
<script>
const { rand } = Arcade;
const ROUND = 60;
let R, bubbles = [], bursts = [], combo, lastPop, left, spawnIn;

const game = Arcade.create({
  id: 'bubble-pop',
  keys: [['Tap', 'pop'], ['Quick pops', 'combo up to ×5'], ['A', 'pop the highest']],
  resize(W, H) { R = Math.min(W, H) * 0.075; },
  start() { bubbles = []; bursts = []; combo = 0; lastPop = 0; left = ROUND; spawnIn = 0; },
  tap: pop,
  key(k) {
    if (k !== 'a' && k !== 'b') return;
    // The bubble closest to escaping, so a passenger on the gamepad can still score.
    const target = bubbles.filter(b => b.y < game.H - b.r).sort((a, b) => a.y - b.y)[0];
    if (target) pop(target.x, target.y);
  },
  update(dt) {
    left -= dt;
    if (left <= 0) { game.end("Time's up!"); return; }
    const progress = 1 - left / ROUND;
    spawnIn -= dt;
    if (spawnIn <= 0) { spawn(progress); spawnIn = 0.65 - progress * 0.38; }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y -= b.vy * dt; b.wob += dt * 2;
      if (b.y < -b.r) { bubbles.splice(i, 1); combo = 0; }
    }
  },
  draw(g, W, H, t) {
    const bg = g.createRadialGradient(W / 2, H * 1.1, 0, W / 2, H * 1.1, H * 1.4);
    bg.addColorStop(0, '#123047'); bg.addColorStop(1, '#0B0D12');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    for (const b of bubbles) {
      const x = b.x + Math.sin(b.wob) * b.r * 0.15;
      const grad = g.createRadialGradient(x - b.r * .35, b.y - b.r * .35, b.r * .1, x, b.y, b.r);
      grad.addColorStop(0, b.gold ? '#fff6d8' : `hsla(${b.hue},90%,85%,.9)`);
      grad.addColorStop(1, b.gold ? '#FFC24B' : `hsla(${b.hue},80%,55%,.35)`);
      g.fillStyle = grad; g.beginPath(); g.arc(x, b.y, b.r, 0, 7); g.fill();
      g.strokeStyle = b.gold ? '#ffe2a3' : `hsla(${b.hue},90%,80%,.8)`; g.lineWidth = 2; g.stroke();
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const p = bursts[i], k = (t - p.t) / 400;
      if (k > 1) { bursts.splice(i, 1); continue; }
      g.globalAlpha = 1 - k; g.strokeStyle = `hsl(${p.hue},90%,70%)`; g.lineWidth = 3;
      for (let a = 0; a < 8; a++) {
        const ang = a * Math.PI / 4;
        g.beginPath();
        g.moveTo(p.x + Math.cos(ang) * p.r * (0.6 + k), p.y + Math.sin(ang) * p.r * (0.6 + k));
        g.lineTo(p.x + Math.cos(ang) * p.r * (0.9 + k), p.y + Math.sin(ang) * p.r * (0.9 + k));
        g.stroke();
      }
      g.globalAlpha = 1;
    }
    if (game.state !== 'ready') timeBar(g, W, H);
  },
});

function spawn(progress) {
  const gold = Math.random() < 0.08;
  const r = R * (gold ? 0.75 : 0.8 + Math.random() * 0.6);
  bubbles.push({
    x: r + Math.random() * (game.W - 2 * r), y: game.H + r, r, gold, wob: rand(0, 6), hue: rand(170, 310),
    vy: (game.H / 7) * (1 + progress * 1.6) * (gold ? 1.5 : rand(0.8, 1.3)),
  });
}

function pop(x, y) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    // A little extra radius forgives big fingers and bumpy roads.
    if (Math.hypot(x - b.x, y - b.y) > b.r * 1.25) continue;
    const now = performance.now();
    combo = now - lastPop < 900 ? combo + 1 : 1; lastPop = now;
    const pts = (b.gold ? 5 : 1) * Math.min(combo, 5);
    game.add(pts); bubbles.splice(i, 1);
    bursts.push({ x: b.x, y: b.y, r: b.r, t: now, hue: b.gold ? 42 : b.hue });
    game.float(combo > 1 ? `+${pts} ×${Math.min(combo, 5)}` : '+' + pts, b.x, b.y, b.gold ? '#FFC24B' : '#fff');
    game.sfx('tap', 1 + Math.min(combo, 5) * 0.12);
    return;
  }
  combo = 0;
}

function timeBar(g, W, H) {
  const k = Math.max(0, left / ROUND);
  g.fillStyle = '#ffffff14'; g.fillRect(0, H - 8, W, 8);
  g.fillStyle = k > 0.2 ? '#4CC9F0' : '#FF5A5F'; g.fillRect(0, H - 8, W * k, 8);
}
</script>
</body>
</html>
