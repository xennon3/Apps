<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Lane</title>
<style>
  :root { --bg:#0E1116; --card:#1A1F27; --text:#EEF1F5; --muted:#8A94A3; --accent:#FFB547; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,Roboto,sans-serif; user-select:none; }
  body { display:flex; flex-direction:column; padding:3vh 3vw; box-sizing:border-box; gap:2vh; }
  #hud { display:flex; gap:3vw; font-size:clamp(16px,4vh,28px); font-weight:700; }
  #hud span { color:var(--muted); font-weight:400; }
  #board { flex:1; display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(3,1fr); gap:1.6vmin; }
  .card { perspective:800px; cursor:pointer; }
  .inner { position:relative; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; }
  .card.up .inner, .card.done .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:14px; display:grid; place-items:center; backface-visibility:hidden; }
  .back { background:repeating-linear-gradient(45deg,#232a35 0 10px,#1A1F27 10px 20px); border:2px solid #2A313C; }
  .front { background:#EEF1F5; transform:rotateY(180deg); font-size:min(11vh,8vw); }
  .card.done .front { background:#d8f5e1; }
  .card.cursor .face { outline:4px solid var(--accent); outline-offset:2px; }
  #msg { position:fixed; inset:0; display:none; place-content:center; text-align:center; gap:2vh;
    background:#0E1116dd; font-size:clamp(18px,4.5vh,34px); }
  #msg b { font-size:1.6em; color:var(--accent); }
  #msg small { color:var(--muted); font-size:.55em; }
</style>
</head>
<body>
<div id="hud"><div id="moves">0 <span>moves</span></div><div id="pairs">0/9 <span>pairs</span></div><div id="time">0:00</div></div>
<div id="board"></div>
<div id="msg"></div>
<script>
const SIGNS = ['🛑', '⚠️', '🚸', '⛽', '🅿️', '🚦', '🚧', '🛣️', '🏁'];
const board = document.getElementById('board'), msg = document.getElementById('msg');
let cards, open, moves, pairs, started, timer, cursor = 0, busy = false;

function deal() {
  const deck = [...SIGNS, ...SIGNS].sort(() => Math.random() - .5);
  board.innerHTML = ''; open = []; moves = 0; pairs = 0; started = 0; busy = false;
  cards = deck.map((sign, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="inner"><div class="face back"></div><div class="face front">${sign}</div></div>`;
    el.addEventListener('pointerdown', () => flip(i));
    board.appendChild(el);
    return { el, sign };
  });
  msg.style.display = 'none'; clearInterval(timer); timer = setInterval(hud, 500); hud(); moveCursor(0);
}

function flip(i) {
  const card = cards[i];
  if (busy || open.includes(card) || card.el.classList.contains('done')) return;
  if (!started) started = Date.now();
  card.el.classList.add('up'); open.push(card);
  if (open.length < 2) return;
  moves++; busy = true;
  const [a, b] = open;
  setTimeout(() => {
    if (a.sign === b.sign) { a.el.classList.add('done'); b.el.classList.add('done'); pairs++;
      if (navigator.vibrate) navigator.vibrate(30); }
    else { a.el.classList.remove('up'); b.el.classList.remove('up'); }
    open = []; busy = false; hud();
    if (pairs === SIGNS.length) win();
  }, a.sign === b.sign ? 250 : 800);
  hud();
}

function elapsed() { return started ? Math.floor((Date.now() - started) / 1000) : 0; }
function clock(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function hud() {
  document.getElementById('moves').innerHTML = `${moves} <span>moves</span>`;
  document.getElementById('pairs').innerHTML = `${pairs}/${SIGNS.length} <span>pairs</span>`;
  if (pairs < SIGNS.length) document.getElementById('time').textContent = clock(elapsed());
}

function win() {
  clearInterval(timer);
  const best = Math.min(+localStorage.memoryBest || Infinity, moves); localStorage.memoryBest = best;
  msg.innerHTML = `<b>All matched!</b>${moves} moves in ${clock(elapsed())}<small>Best: ${best} moves · tap to deal again</small>`;
  msg.style.display = 'grid';
}
msg.addEventListener('pointerdown', deal);

// Phone gamepad: arrows move a highlight, A flips the highlighted card.
function moveCursor(i) {
  cards[cursor]?.el.classList.remove('cursor');
  cursor = (i + cards.length) % cards.length;
  cards[cursor].el.classList.add('cursor');
}
addEventListener('keydown', e => {
  if (msg.style.display === 'grid') { if (e.key === ' ' || e.key === 'Enter') deal(); return; }
  const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -6, ArrowDown: 6 }[e.key];
  if (step) { e.preventDefault(); moveCursor(cursor + step); }
  else if (e.key === ' ' || e.key === 'Enter') flip(cursor);
});

deal();
</script>
</body>
</html>
