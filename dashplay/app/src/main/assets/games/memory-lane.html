<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Lane</title>
<link rel="stylesheet" href="../kit/arcade.css">
<style>
  #stage { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1.6vmin; padding: 12vh 3vw 3vh; }
  .card3d { perspective: 800px; cursor: pointer; min-height: 0; }
  .inner { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
  .card3d.up .inner, .card3d.done .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; backface-visibility: hidden; }
  .back {
    background: repeating-linear-gradient(45deg, #232a35 0 10px, #1A1F27 10px 20px); border: 2px solid var(--line);
  }
  .back::after { content: ''; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); }
  .front { background: #EEF1F5; transform: rotateY(180deg); font-size: min(11vh, 8vw); }
  .card3d.done .front { background: #d8f5e1; animation: pop .3s; }
  .card3d.cursor .face { outline: 4px solid var(--accent); outline-offset: 2px; }
  @media (max-aspect-ratio: 1/1) { #stage { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(6, 1fr); } }
</style>
</head>
<body>
<script src="../kit/games.js"></script>
<script src="../kit/arcade.js"></script>
<script>
const SIGNS = ['🛑', '⚠️', '🚸', '⛽', '🅿️', '🚦', '🚧', '🛣️', '🏁'];
let cards, open, pairs, busy, cursor = 0, usedPad = false;

const game = Arcade.create({
  id: 'memory-lane',
  canvas: false,
  lowerIsBetter: true,
  format: n => n + (n === 1 ? ' move' : ' moves'),
  keys: [['Tap', 'flip a card'], ['Arrows + A', 'gamepad']],
  start: deal,
  key(k) {
    const step = { left: -1, right: 1, up: -6, down: 6 }[k];
    if (step) { usedPad = true; moveCursor(cursor + step); }
    if (k === 'a' || k === 'b') flip(cursor);
  },
});

function deal() {
  const deck = [...SIGNS, ...SIGNS].sort(() => Math.random() - 0.5);
  game.stage.innerHTML = ''; open = []; pairs = 0; busy = false;
  cards = deck.map((sign, i) => {
    const el = document.createElement('div');
    el.className = 'card3d';
    el.innerHTML = `<div class="inner"><div class="face back"></div><div class="face front">${sign}</div></div>`;
    el.addEventListener('pointerdown', e => { e.preventDefault(); flip(i); });
    game.stage.append(el);
    return { el, sign };
  });
  moveCursor(cursor);
}
deal();

function moveCursor(i) {
  cards[cursor]?.el.classList.remove('cursor');
  cursor = (i + cards.length) % cards.length;
  if (usedPad) cards[cursor].el.classList.add('cursor');
}

function flip(i) {
  const card = cards[i];
  if (game.state !== 'playing' || busy || open.includes(card) || card.el.classList.contains('done')) return;
  card.el.classList.add('up'); open.push(card); game.sfx('flip');
  if (open.length < 2) return;
  game.add(1); busy = true;
  const [a, b] = open, match = a.sign === b.sign;
  setTimeout(() => {
    if (match) {
      a.el.classList.add('done'); b.el.classList.add('done'); pairs++; game.sfx('point');
    } else { a.el.classList.remove('up'); b.el.classList.remove('up'); }
    open = []; busy = false;
    if (pairs === SIGNS.length) game.end('All matched!');
  }, match ? 250 : 800);
}
</script>
</body>
</html>
