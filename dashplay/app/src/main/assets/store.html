<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<link rel="stylesheet" href="kit/arcade.css">
<style>
  html, body { overflow: auto; touch-action: pan-y; }
  body { padding: max(12px, 2.4vh) max(16px, 3vw) 4vh; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 2vh; }
  .top h1 { margin: 0; font-size: clamp(22px, 5vh, 34px); }
  .top .state { margin-left: auto; color: var(--muted); font-size: clamp(12px, 2.3vh, 15px); text-align: right; }
  .banner {
    margin-bottom: 2vh; padding: 12px 16px; border-radius: 16px; font-size: clamp(13px, 2.5vh, 16px);
    background: color-mix(in srgb, #FFC24B 14%, var(--surface)); border: 1px solid color-mix(in srgb, #FFC24B 35%, var(--line));
  }
  h2 { margin: 3vh 2px 1.4vh; font-size: clamp(12px, 2.3vh, 14px); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: max(10px, 1.4vw); }
  .item {
    --c: #8B95A7; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 4px 14px; align-items: center;
    padding: 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
  }
  .item .art {
    grid-row: 1 / 3; width: max(60px, 11vh); aspect-ratio: 1; border-radius: 18px; display: grid; place-items: center;
    font-size: max(30px, 6vh); background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--c) 55%, transparent), color-mix(in srgb, var(--c) 18%, var(--surface-2)));
  }
  .item .info { min-width: 0; }
  .item b { font-size: clamp(16px, 3.2vh, 20px); }
  .item p { margin: 2px 0 0; color: var(--muted); font-size: clamp(12px, 2.3vh, 14px); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item small { color: var(--muted); font-size: 12px; }
  .item small .ok { color: var(--good); font-weight: 700; }
  .actions { display: flex; gap: 8px; }
  .actions button {
    height: max(44px, 8vh); padding: 0 18px; border-radius: 14px; font-weight: 800; font-size: clamp(14px, 2.7vh, 17px);
    background: var(--surface-2); border: 1px solid var(--line);
  }
  .actions .main { background: var(--c); color: #111; border: 0; flex: 1; }
  .actions .remove { color: var(--muted); }
  .actions button:disabled { opacity: .55; }
  .actions button:active { transform: scale(.97); }
  .empty { color: var(--muted); padding: 2vh 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 4vh; transform: translate(-50%, 20px); opacity: 0; transition: .25s; pointer-events: none;
    padding: 10px 16px; border-radius: 14px; background: var(--text); color: #111; font-weight: 700; font-size: 14px; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div class="top">
    <button class="chip" id="home">‹ Home</button>
    <h1>Store</h1>
    <div class="state" id="state"></div>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div id="shelves"></div>
  <div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
// Native side (Store.Api). Missing in a plain browser, where nothing can be installed.
const api = window.DashplayStore || { catalogUrl: () => 'catalog.json', installed: () => '[]', install() {}, remove() {} };
const SHELVES = [['tool', 'Tools'], ['game', 'Games']];
let catalog = [], installed = [], busy = {}, offline = false;

$('home').onclick = () => location.href = window.DashplayRemote ? 'remote.html' : 'index.html';

function readCache() { try { return JSON.parse(localStorage.getItem('dashplay.storeCatalog')) || null; } catch (e) { return null; } }
function writeCache(c) { try { localStorage.setItem('dashplay.storeCatalog', JSON.stringify(c)); } catch (e) {} }

async function loadCatalog() {
  $('state').textContent = 'Checking for tools…';
  try {
    const res = await fetch(api.catalogUrl(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    catalog = data.items || [];
    writeCache({ items: catalog, at: Date.now() });
    offline = false;
  } catch (e) {
    const cached = readCache();
    catalog = cached ? cached.items : [];
    offline = true;
  }
  render();
}

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}

const size = n => !n ? '' : n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

function render() {
  installed = JSON.parse(api.installed());
  const mine = Object.fromEntries(installed.map(i => [i.id, i]));
  // Installed items stay listed offline, even ones no longer in the catalog.
  const all = [...catalog];
  installed.forEach(i => { if (!all.some(c => c.id === i.id)) all.push(i); });

  $('banner').hidden = !offline;
  $('banner').textContent = 'No connection. Your installed tools still work; installing new ones needs a signal.';
  const cached = readCache();
  $('state').textContent = offline
    ? (cached ? 'Offline · last checked ' + new Date(cached.at).toLocaleDateString() : 'Offline')
    : `${installed.length} installed · ${catalog.length} available`;

  $('shelves').innerHTML = '';
  SHELVES.forEach(([kind, title]) => {
    const items = all.filter(i => (i.kind || 'tool') === kind);
    if (!items.length) return;
    const h = document.createElement('h2'); h.textContent = title;
    const shelf = document.createElement('div'); shelf.className = 'shelf';
    items.forEach(item => shelf.append(card(item, mine[item.id])));
    $('shelves').append(h, shelf);
  });
  if (!all.length) $('shelves').innerHTML = `<p class="empty">${offline ? 'Connect to the internet to browse the store.' : 'The store is empty right now.'}</p>`;
}

function card(item, have) {
  const el = document.createElement('div');
  el.className = 'item';
  el.style.setProperty('--c', item.color || '#8B95A7');
  const inCatalog = catalog.find(c => c.id === item.id);
  const update = have && inCatalog && inCatalog.version !== have.version;
  el.innerHTML = `<div class="art"></div><div class="info"><b></b><p></p>
    <small>${have ? `<span class="ok">✓ Installed</span> · v${have.version || '?'}` : `v${item.version || '?'}${item.size ? ' · ' + size(item.size) : ''}`}${update ? ' · update available' : ''}</small></div>
    <div class="actions" style="grid-column: 1 / -1"></div>`;
  el.querySelector('.art').textContent = item.emoji || '📦';
  el.querySelector('b').textContent = item.title;
  el.querySelector('p').textContent = item.blurb || '';
  const actions = el.querySelector('.actions');
  const button = (label, cls, fn, disabled) => {
    const b = document.createElement('button'); b.textContent = label; b.className = cls; b.disabled = !!disabled; b.onclick = fn;
    actions.append(b);
  };
  if (busy[item.id]) button(busy[item.id], 'main', null, true);
  else if (update) button('Update', 'main', () => install(inCatalog), offline);
  else if (have) button('Open', 'main', () => location.href = `/store/${item.id}/${have.entry || 'index.html'}`);
  else button('Install', 'main', () => install(item), offline);
  if (have && !busy[item.id]) button('Remove', 'remove', () => { busy[item.id] = 'Removing…'; render(); api.remove(item.id); });
  return el;
}

function install(item) {
  busy[item.id] = 'Installing…'; render();
  api.install(JSON.stringify(item));
}

// Store.Api answers here once a download or removal finishes.
window.onStoreResult = r => {
  delete busy[r.id];
  const item = catalog.find(c => c.id === r.id) || installed.find(i => i.id === r.id) || { title: r.id };
  if (!r.ok) toast(`Couldn't ${r.action} ${item.title}: ${r.error}`);
  else toast(r.action === 'install' ? `${item.emoji || ''} ${item.title} is installed` : `${item.title} removed`);
  render();
};

loadCatalog();
</script>
</body>
</html>
