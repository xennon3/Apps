<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashplay</title>
<link rel="stylesheet" href="kit/arcade.css">
<style>
  body { display: grid; grid-template-columns: minmax(220px, min(27vw, 380px)) 1fr; gap: max(16px, 2.4vw); padding: max(14px, 3vh) max(16px, 2.4vw); }

  /* Left rail */
  .rail { display: flex; flex-direction: column; gap: 2.4vh; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: clamp(16px, 3.4vh, 22px); }
  .brand i {
    width: 1.7em; height: 1.7em; border-radius: 10px; display: grid; place-items: center; font-style: normal; font-size: .8em;
    background: #FFC24B; color: #111;
  }
  .clock { font-size: clamp(44px, 15vh, 112px); font-weight: 800; letter-spacing: -.03em; line-height: .9; }
  .date { color: var(--muted); font-size: clamp(14px, 3vh, 20px); margin-top: .6vh; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 8px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); font-size: clamp(13px, 2.5vh, 16px); font-weight: 600;
  }
  .status::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); }
  .web {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); font-size: clamp(15px, 3vh, 19px);
  }
  .web span { font-size: 1.4em; }
  .web i { margin-left: auto; font-style: normal; color: var(--muted); font-size: 1.4em; }
  .web:active { background: var(--surface-2); }
  .continue {
    margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius);
    background: linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, var(--surface)), var(--surface));
    border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); text-align: left;
  }
  .continue .art { font-size: max(34px, 8vh); }
  .continue small { display: block; color: var(--muted); font-size: clamp(12px, 2.3vh, 15px); font-weight: 600; }
  .continue b { font-size: clamp(16px, 3.4vh, 22px); }
  .continue .go { margin-left: auto; width: max(44px, 8vh); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #111; font-size: max(16px, 3vh); }

  /* Game grid, paged so it never needs scrolling on a car screen */
  .main { display: flex; flex-direction: column; gap: 2vh; min-height: 0; }
  .grid { flex: 1; display: grid; gap: max(12px, 1.6vw); min-height: 0; }
  .tile {
    --c: #FFC24B; position: relative; overflow: hidden; border-radius: var(--radius); text-align: left; min-height: 0;
    display: flex; flex-direction: column; justify-content: flex-end; padding: max(12px, 2.2vh) max(14px, 1.4vw);
    background:
      radial-gradient(120% 90% at 85% 10%, color-mix(in srgb, var(--c) 55%, transparent), transparent 60%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 26%, var(--surface)), var(--surface) 70%);
    border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line));
    transition: transform .12s;
    animation: in .35s both;
    container-type: size;
  }
  .tile:active { transform: scale(.97); }
  .tile.focus { outline: 4px solid var(--text); outline-offset: 3px; }
  .tile .art {
    position: absolute; right: 7%; top: 9%; font-size: min(40cqh, 30cqw); line-height: 1;
    filter: drop-shadow(0 10px 18px #0008); transform: rotate(-6deg);
  }
  .tile .tag {
    position: absolute; left: max(12px, 1.4vw); top: max(12px, 2.2vh); padding: 4px 10px; border-radius: 999px;
    font-size: clamp(11px, 2vh, 13px); font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    background: #0B0D1299; color: color-mix(in srgb, var(--c) 70%, #fff);
  }
  .tile b { position: relative; font-size: clamp(16px, 3.8vh, 26px); line-height: 1.1; }
  .tile small { position: relative; color: #C9D0DB; font-size: clamp(12px, 2.3vh, 15px); margin-top: 4px; }
  @container (max-height: 175px) {
    .tile small.blurb { display: none; }
    .tile .art { font-size: min(46cqh, 30cqw); }
  }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }

  .tabs { display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); align-self: flex-start; }
  .tabs button { height: max(42px, 7.5vh); padding: 0 max(16px, 1.8vw); border-radius: 999px; font-weight: 700; font-size: clamp(14px, 2.9vh, 18px); color: var(--muted); }
  .tabs button.on { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .pager button {
    width: max(56px, 10vh); height: max(48px, 8.5vh); border-radius: 16px; background: var(--surface-2);
    border: 1px solid var(--line); font-size: max(20px, 4vh);
  }
  .pager button:disabled { opacity: .3; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: width .2s; }
  .dots i.on { width: 26px; border-radius: 6px; background: var(--text); }

  @media (max-aspect-ratio: 1/1) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: auto; }
    .rail { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
    .clock { font-size: 13vw; }
    .web {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); font-size: clamp(15px, 3vh, 19px);
  }
  .web span { font-size: 1.4em; }
  .web i { margin-left: auto; font-style: normal; color: var(--muted); font-size: 1.4em; }
  .web:active { background: var(--surface-2); }
  .continue { margin-top: 0; width: 100%; }
  }
</style>
</head>
<body>
  <section class="rail">
    <div class="brand"><i>▶</i>Dashplay</div>
    <div><div class="clock num" id="clock"></div><div class="date" id="date"></div></div>
    <div class="status">Parked · ready to play</div>
    <button class="web" id="web"><span>🌐</span><b>Web browser</b><i>›</i></button>
    <button class="continue" id="continue" hidden></button>
  </section>
  <section class="main">
    <div class="tabs" id="tabs">
      <button data-tab="games">🎮 Games</button><button data-tab="tools">🧰 Tools</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager">
      <button id="prev" aria-label="Previous page">‹</button>
      <div class="dots" id="dots"></div>
      <button id="next" aria-label="Next page">›</button>
    </div>
  </section>
<script src="kit/games.js"></script>
<!-- Written by the app when something is installed from the store; missing until then. -->
<script src="/store/installed.js"></script>
<script>
const read = k => { try { return JSON.parse(localStorage.getItem('dashplay.' + k)); } catch (e) { return null; } };
const INSTALLED = window.DASHPLAY_INSTALLED || [];
const STORE_TILE = { title: 'Store', emoji: '🛍️', color: '#8B95A7', tag: 'Get more', sub: 'Tools and games to install', href: 'store.html' };
// Every tile is { title, emoji, color, tag, sub, href }.
const fromGame = g => ({ ...g, href: `games/${g.id}.html`, best: read('bestText.' + g.id), sub: g.blurb });
const fromStore = i => ({ ...i, tag: i.kind === 'game' ? 'Store' : 'Tool', sub: i.blurb, href: `/store/${i.id}/${i.entry || 'index.html'}` });
const LISTS = {
  games: () => [...window.DASHPLAY_GAMES.map(fromGame), ...INSTALLED.filter(i => i.kind === 'game').map(fromStore)],
  tools: () => [...INSTALLED.filter(i => i.kind !== 'game').map(fromStore), STORE_TILE],
};
let tab = read('homeTab') || 'games';
let ITEMS = [];
const grid = document.getElementById('grid'), dots = document.getElementById('dots');
let page = 0, perPage = 6, cols = 3, focus = -1;

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  document.getElementById('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
tick(); setInterval(tick, 5000);

const open = item => location.href = item.href;
document.getElementById('web').onclick = () => location.href = 'browser.html';

const lastGame = window.DASHPLAY_GAMES.find(g => g.id === read('last'));
const last = lastGame && fromGame(lastGame);
if (last) {
  const c = document.getElementById('continue');
  c.hidden = false; c.style.setProperty('--c', last.color);
  c.innerHTML = `<span class="art">${last.emoji}</span><span><small>Continue</small><b>${last.title}</b></span><span class="go">▶</span>`;
  c.onclick = () => open(last);
}

// Fit as many big cards as the screen allows, then page through the rest.
function layout() {
  const r = grid.getBoundingClientRect();
  cols = Math.max(2, Math.min(4, Math.floor(r.width / 230)));
  const rows = Math.max(1, Math.min(3, Math.floor((r.height + 12) / 170)));
  perPage = cols * rows;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  page = Math.min(page, pages() - 1);
  render();
}
const pages = () => Math.max(1, Math.ceil(ITEMS.length / perPage));

function setTab(t) {
  tab = t; page = 0; focus = -1;
  try { localStorage.setItem('dashplay.homeTab', JSON.stringify(t)); } catch (e) {}
  ITEMS = LISTS[t]();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

function render() {
  grid.innerHTML = '';
  ITEMS.slice(page * perPage, (page + 1) * perPage).forEach((g, i) => {
    const t = document.createElement('button');
    t.className = 'tile' + (i === focus ? ' focus' : '');
    t.style.setProperty('--c', g.color || '#8B95A7');
    t.style.animationDelay = i * 30 + 'ms';
    t.innerHTML = `<span class="tag"></span><span class="art"></span><b></b>${g.best ? `<small>Best ${g.best}</small>` : '<small class="blurb"></small>'}`;
    t.querySelector('.tag').textContent = g.tag || '';
    t.querySelector('.art').textContent = g.emoji || '📦';
    t.querySelector('b').textContent = g.title;
    if (!g.best) t.querySelector('.blurb').textContent = g.sub || '';
    t.onclick = () => open(g);
    grid.append(t);
  });
  dots.innerHTML = Array.from({ length: pages() }, (_, i) => `<i class="${i === page ? 'on' : ''}"></i>`).join('');
  document.getElementById('pager').style.visibility = pages() > 1 ? 'visible' : 'hidden';
  document.getElementById('prev').disabled = page === 0;
  document.getElementById('next').disabled = page >= pages() - 1;
}

function go(d) { page = Math.max(0, Math.min(pages() - 1, page + d)); render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);

// Phone gamepad: arrows move a highlight across pages, A opens.
addEventListener('keydown', e => {
  const onPage = Math.min(perPage, ITEMS.length - page * perPage);
  if (focus < 0 && e.key.startsWith('Arrow')) { focus = 0; render(); return; }
  const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
  if (step) {
    let i = page * perPage + focus + step;
    i = Math.max(0, Math.min(ITEMS.length - 1, i));
    page = Math.floor(i / perPage); focus = i % perPage;
    render();
  } else if ((e.key === ' ' || e.key === 'Enter') && focus >= 0 && focus < onPage) {
    open(ITEMS[page * perPage + focus]);
  }
});

addEventListener('resize', layout);
ITEMS = LISTS[tab]();
document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
layout();
</script>
</body>
</html>
