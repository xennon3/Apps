<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking timer</title>
<link rel="stylesheet" href="/assets/kit/arcade.css">
<style>
  body { display: flex; flex-direction: column; }
  .app { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: max(24px, 5vw); padding: 0 4vw 3vh; }
  .ring { --size: min(74vh, 42vw); width: var(--size); height: var(--size); position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .left { font-size: calc(var(--size) * .2); font-weight: 800; line-height: 1; }
  .sub { color: var(--muted); font-size: clamp(13px, 2.8vh, 18px); margin-top: 1vh; }
  .side { display: flex; flex-direction: column; gap: 1.8vh; width: min(44vw, 440px); }
  .side h2 { margin: 0; font-size: clamp(20px, 4.6vh, 30px); }
  .side p { margin: 0; color: var(--muted); font-size: clamp(13px, 2.6vh, 16px); line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid button, .adjust button {
    height: max(50px, 9vh); border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 800;
    font-size: clamp(15px, 3.2vh, 20px);
  }
  .adjust { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .main { height: max(58px, 11vh); border-radius: 18px; font-weight: 800; font-size: clamp(17px, 3.8vh, 24px); background: var(--accent); color: #111; }
  .stop { height: max(50px, 9vh); border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: clamp(15px, 3vh, 19px); }
  button:active { transform: scale(.97); }
  .ring.urgent .left { color: var(--bad); }
  .ring.done { animation: flash 1s infinite; }
  @keyframes flash { 50% { opacity: .35; } }
  @media (max-aspect-ratio: 1/1) { .app { flex-direction: column; } .ring { --size: min(70vw, 40vh); } .side { width: 92vw; } }
</style>
</head>
<body>
<div class="app">
  <div class="ring" id="ring">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#1E2430" stroke-width="8"/>
      <circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
    <div class="mid"><div class="left num" id="left">0:30</div><div class="sub" id="sub">Set your meter time</div></div>
  </div>
  <div class="side" id="side"></div>
</div>
<script src="/assets/kit/tool.js"></script>
<script>
Tool.header('Parking timer', '#2EC4B6');
const $ = id => document.getElementById(id);
// Saved as timestamps, so the countdown survives leaving the tool or restarting the car.
let state = Tool.store.get('parking', null);   // { start, end, warned: [] } while running
let setMins = Tool.store.get('parking.mins', 30);

const clock = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}
const mins = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : m + ' min';

function save() { Tool.store.set('parking', state); Tool.store.set('parking.mins', setMins); }

function renderSetup() {
  $('side').innerHTML = `<h2>How long is your meter?</h2>
    <div class="grid">${[15, 30, 60, 120].map(m => `<button data-m="${m}">${mins(m)}</button>`).join('')}</div>
    <div class="adjust"><button data-d="-5">− 5 min</button><button data-d="5">+ 5 min</button></div>
    <button class="main" id="go">Start · ${mins(setMins)}</button>
    <p>You'll hear a beep 10 and 5 minutes before it runs out, while this tool is open.</p>`;
  $('side').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { setMins = +b.dataset.m; save(); renderSetup(); });
  $('side').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { setMins = Math.max(5, Math.min(600, setMins + +b.dataset.d)); save(); renderSetup(); });
  $('go').onclick = () => { const now = Date.now(); state = { start: now, end: now + setMins * 60000, warned: [] }; save(); Tool.beep(660); render(); };
}

function renderRunning() {
  $('side').innerHTML = `<h2>Parked at ${clock(state.start)}</h2>
    <p>Meter runs out at <b style="color:var(--text)">${clock(state.end)}</b>.</p>
    <div class="adjust"><button data-d="15">+ 15 min</button><button data-d="30">+ 30 min</button></div>
    <button class="stop" id="stop">I'm back · stop timer</button>`;
  $('side').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { state.end += +b.dataset.d * 60000; state.warned = []; save(); render(); });
  $('stop').onclick = () => { state = null; save(); render(); };
}

let mode = null;
function render() {
  const next = state ? 'running' : 'setup';
  if (next !== mode) { mode = next; next === 'running' ? renderRunning() : renderSetup(); }
  tick();
}

function tick() {
  const ring = $('ring');
  if (!state) {
    $('left').textContent = fmt(setMins * 60000);
    $('sub').textContent = 'Set your meter time';
    $('arc').setAttribute('stroke-dashoffset', 0);
    ring.className = 'ring';
    return;
  }
  const left = state.end - Date.now(), total = state.end - state.start;
  $('left').textContent = left > 0 ? fmt(left) : '0:00';
  $('sub').textContent = left > 0 ? 'left on the meter' : 'Meter expired';
  $('arc').setAttribute('stroke-dashoffset', 100 - Math.max(0, left / total) * 100);
  ring.className = 'ring' + (left <= 0 ? ' done' : left < 600000 ? ' urgent' : '');
  // Warnings at 10 min, 5 min and zero, once each.
  [[600000, 2], [300000, 3], [0, 6]].forEach(([at, beeps]) => {
    if (left <= at && !state.warned.includes(at)) {
      state.warned.push(at); save();
      for (let i = 0; i < beeps; i++) setTimeout(() => Tool.beep(at ? 880 : 1040, 0.25, 0.35), i * 350);
    }
  });
}

render();
setInterval(tick, 500);
</script>
</body>
</html>
