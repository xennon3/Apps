<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="/assets/kit/arcade.css">
<style>
  body { display: flex; flex-direction: column; }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr minmax(0, 1.15fr); gap: max(12px, 2vw); padding: 0 max(14px, 2.4vw) max(12px, 2.4vh); }
  .left { display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
  .screen {
    flex: 1; min-height: 30%; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: .6vh;
    padding: 2vh 2vw; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); overflow: hidden;
  }
  .expr { color: var(--muted); font-size: clamp(16px, 4.4vh, 28px); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; direction: rtl; }
  .result { font-size: clamp(36px, 14vh, 96px); font-weight: 800; line-height: 1; white-space: nowrap; max-width: 100%; overflow: hidden; }
  .result.small { font-size: clamp(28px, 9vh, 64px); }
  .left:has(.tip.on) .result { font-size: clamp(30px, 9vh, 64px); }
  .tip { display: none; flex-direction: column; gap: 1.2vh; padding: 1.6vh 1.6vw; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
  .tip.on { display: flex; }
  .row { display: flex; gap: 8px; align-items: center; }
  .chips button, .step button {
    height: max(40px, 7vh); border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 800;
    font-size: clamp(14px, 3vh, 19px); flex: 1;
  }
  .chips button.on { background: var(--accent); color: #111; border: 0; }
  .step { gap: 10px; }
  .step button { flex: none; width: max(44px, 8vh); }
  .step span { flex: 1; text-align: center; font-weight: 800; font-size: clamp(16px, 3.4vh, 22px); }
  .sums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sums div { text-align: center; }
  .sums small { display: block; color: var(--muted); font-size: clamp(11px, 2.2vh, 14px); }
  .sums b { font-size: clamp(16px, 4vh, 26px); }
  .sums .each b { color: var(--accent); }
  .keypad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: max(8px, 1.2vh); min-height: 0; }
  .keypad button {
    border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); font-size: clamp(20px, 5vh, 34px); font-weight: 700;
    min-height: 0;
  }
  .keypad button:active { filter: brightness(1.3); transform: scale(.96); }
  .keypad .op { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); color: var(--accent); }
  .keypad .eq { background: var(--accent); color: #111; border: 0; }
  .keypad .fn { color: var(--muted); }
  .tipToggle.on { background: var(--accent); color: #111; }
  @media (max-aspect-ratio: 1/1) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .screen { min-height: 22vh; }
    .keypad button { font-size: 7vw; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="screen"><div class="expr" id="expr">&nbsp;</div><div class="result num" id="result">0</div></div>
    <div class="tip" id="tip">
      <div class="row chips" id="tips"></div>
      <div class="row step"><button id="minus">−</button><span id="people">1 person</span><button id="plus">+</button></div>
      <div class="sums">
        <div><small>Tip</small><b class="num" id="tipAmt">0</b></div>
        <div><small>Total</small><b class="num" id="total">0</b></div>
        <div class="each"><small>Each</small><b class="num" id="each">0</b></div>
      </div>
    </div>
  </div>
  <div class="keypad" id="keys"></div>
</div>
<script src="/assets/kit/tool.js"></script>
<script>
const bar = Tool.header('Calculator', '#4C8DF0');
const toggle = document.createElement('button');
toggle.className = 'chip tipToggle'; toggle.textContent = 'Tip & split';
bar.append(toggle);

const $ = id => document.getElementById(id);
const KEYS = [
  ['C', 'fn'], ['⌫', 'fn'], ['%', 'fn'], ['÷', 'op'],
  ['7'], ['8'], ['9'], ['×', 'op'],
  ['4'], ['5'], ['6'], ['−', 'op'],
  ['1'], ['2'], ['3'], ['+', 'op'],
  ['±', 'fn'], ['0'], ['.'], ['=', 'eq'],
];
let expr = '', shown = '0', justSolved = false;
let tipPct = Tool.store.get('calc.tip', 18), people = 1;

KEYS.forEach(([k, cls]) => {
  const b = document.createElement('button');
  b.textContent = k; if (cls) b.className = cls;
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(k); });
  $('keys').append(b);
});

// A tiny parser instead of eval(): numbers, + − × ÷, unary minus, and % as "divide by 100".
function evaluate(text) {
  const tokens = text.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').match(/\d*\.?\d+|[-+*/%]/g) || [];
  let i = 0;
  const peek = () => tokens[i], next = () => tokens[i++];
  function factor() {
    let t = next();
    if (t === '-') return -factor();
    if (t === '+') return factor();
    let v = parseFloat(t);
    if (Number.isNaN(v)) throw new Error('bad');
    while (peek() === '%') { next(); v /= 100; }
    return v;
  }
  function term() {
    let v = factor();
    while (peek() === '*' || peek() === '/') { const op = next(); const r = factor(); v = op === '*' ? v * r : v / r; }
    return v;
  }
  function sum() {
    let v = term();
    while (peek() === '+' || peek() === '-') { const op = next(); const r = term(); v = op === '+' ? v + r : v - r; }
    return v;
  }
  const v = sum();
  if (i < tokens.length) throw new Error('bad');
  return v;
}

function format(n) {
  if (!Number.isFinite(n)) return 'Error';
  const r = Math.round(n * 1e10) / 1e10;
  return Math.abs(r) >= 1e12 ? r.toExponential(6) : r.toLocaleString(undefined, { maximumFractionDigits: 10 });
}

function preview() {
  try { return format(evaluate(expr)); } catch (e) { return shown; }
}

function press(k) {
  Tool.beep(1200, 0.03, 0.06);
  const isOp = '+−×÷'.includes(k);
  if (k === 'C') { expr = ''; shown = '0'; }
  else if (k === '⌫') { expr = expr.slice(0, -1); }
  else if (k === '=') {
    try { shown = format(evaluate(expr)); $('expr').textContent = expr + ' ='; expr = String(evaluate(expr)); justSolved = true; render(false); return; }
    catch (e) { shown = 'Error'; }
  } else if (k === '±') {
    const m = expr.match(/(.*?)(-?)(\d*\.?\d*)$/);
    expr = m[1] + (m[2] ? '' : '-') + m[3];
  } else {
    if (justSolved && !isOp && k !== '%') expr = '';
    if (isOp && /[+−×÷]$/.test(expr)) expr = expr.slice(0, -1);
    if (k === '.' && /\.\d*$/.test(expr)) return;
    expr += k;
  }
  justSolved = false;
  render(true);
}

function render(live) {
  if (live) {
    $('expr').innerHTML = expr ? expr.replace(/-/g, '−') : '&nbsp;';
    shown = expr ? preview() : '0';
  }
  const r = $('result');
  r.textContent = shown;
  r.classList.toggle('small', shown.length > 10);
  renderTip();
}

// Tip & split works on whatever number is on screen.
[10, 15, 18, 20, 25].forEach(p => {
  const b = document.createElement('button');
  b.textContent = p + '%'; b.dataset.p = p;
  b.onclick = () => { tipPct = p; Tool.store.set('calc.tip', p); renderTip(); };
  $('tips').append(b);
});
$('minus').onclick = () => { people = Math.max(1, people - 1); renderTip(); };
$('plus').onclick = () => { people = Math.min(20, people + 1); renderTip(); };
toggle.onclick = () => { const on = $('tip').classList.toggle('on'); toggle.classList.toggle('on', on); };

function renderTip() {
  let bill = 0;
  try { bill = expr ? evaluate(expr) : 0; } catch (e) {}
  const tip = bill * tipPct / 100, total = bill + tip;
  const money = n => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('tipAmt').textContent = money(tip);
  $('total').textContent = money(total);
  $('each').textContent = money(total / people);
  $('people').textContent = people === 1 ? '1 person' : people + ' people';
  document.querySelectorAll('#tips button').forEach(b => b.classList.toggle('on', +b.dataset.p === tipPct));
}

addEventListener('keydown', e => {
  const map = { '*': '×', '/': '÷', '-': '−', Enter: '=', '=': '=', Backspace: '⌫', Escape: 'C' };
  const k = map[e.key] || e.key;
  if (KEYS.some(([x]) => x === k)) { e.preventDefault(); press(k); }
});
render(true);
</script>
</body>
</html>
